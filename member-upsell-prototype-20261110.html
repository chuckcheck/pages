    * { box-sizing:border-box; }
    body { margin:0; background:#eceef2; color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',
        'Microsoft YaHei',sans-serif; font-size:14px;
      -webkit-font-smoothing:antialiased; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; color:inherit; }
    button,a,input,textarea,select { -webkit-tap-highlight-color:transparent; }
    button { border:0; background:none; padding:0; }
    button:focus-visible,a:focus-visible,input:focus-visible,
    textarea:focus-visible,select:focus-visible {
      outline:3px solid #95bfff; outline-offset:2px;
    }
    [hidden] { display:none !important; }
    .prototype-tools { max-width:782px; padding:18px 0 16px;
      margin:auto; display:flex; align-items:center; gap:10px; }
    .prototype-tools select { margin-left:auto; border:1px solid #d9dde5;
      padding:7px 9px; background:white; border-radius:6px; font-size:12px; }
    .reset { border:1px solid #d9dde5; background:white;
      padding:7px 12px; border-radius:6px; font-size:12px; }
    .mobile-state { display:none; }
    .board { max-width:782px; margin:0 auto 24px;
      display:grid; grid-template-columns:repeat(2,375px); gap:32px; }
    .frame { width:375px; }
    .frame-label { display:flex; justify-content:center; align-items:center;
      height:29px; color:#5c6370; font-size:12px; padding-bottom:8px; }
    .phone { width:375px; height:812px; flex-shrink:0;
      background:white; border:0; border-radius:40px;
      overflow:hidden; position:relative; display:flex; flex-direction:column;
      box-shadow:0 3px 12px #26374708; }
    .ios-status { height:44px; flex:0 0 44px; background:#f4f4f4; }
    .ios-status img { display:block; width:375px; height:44px; }
    .ios-home { height:34px; flex:0 0 34px; background:white; position:relative; }
    .ios-home::after { content:''; position:absolute; width:134px; height:5px;
      border-radius:5px; left:50%; bottom:8px; transform:translateX(-50%);
      background:#202124; }
    .web-head { height:44px; flex-shrink:0; display:flex;
      align-items:center; justify-content:space-between; padding:0 15px;
      background:#f4f4f4; color:#242424; border-bottom:1px solid #ebebeb; }
    .web-head .cross { font-size:29px; font-weight:200; line-height:1; }
    .web-head .title { text-align:center; display:flex; flex-direction:column;
      gap:2px; font-size:17px; font-weight:600; }
    .web-head .title small { font-size:10px; color:#888; font-weight:400; }
    .web-head .more { letter-spacing:2px; font-weight:700; }
    .supervision { background:#fff5df; flex-shrink:0; padding:11px 12px 10px;
      font-size:11px; line-height:1.8; color:#f44c3c; position:relative; }
    .supervision p { margin:0; padding-left:16px; }
    .supervision .first { color:#737373; }
    .supervision .first b { color:#f39427; }
    .supervision .info-icon { position:absolute; left:12px; top:13px;
      width:12px; height:12px; border:1px solid #f49a2b;
      border-radius:50%; text-align:center; line-height:11px;
      font-size:9px; color:#f49a2b; }
    .report-scroll { flex:1; min-height:0; overflow-y:auto;
      overscroll-behavior:contain; scrollbar-width:thin;
      scrollbar-color:#d0d3da transparent; padding:13px 12px 18px;
      background:var(--report-bg) top center/100% auto repeat-y,#f8f9fb; }
    .report-scroll::-webkit-scrollbar { width:3px; }
    .report-scroll::-webkit-scrollbar-thumb { background:#d3d7de;
      border-radius:6px; }
    .product-head { padding:4px 4px 19px;
      background:var(--report-head) top center/100% auto no-repeat; }
    .product-head h1 { font-size:19px; margin:0 0 8px; }
    .brand { font-size:12px; color:#999; }
    .brand span { background:#c3c6cc; color:white; padding:3px 6px;
      border-radius:2px; margin-right:6px; }
    .section { background:white; padding:17px 13px; border-radius:11px;
      margin-bottom:11px; }
    .section-head { display:flex; align-items:center; justify-content:space-between;
      gap:6px; padding-bottom:15px; }
    h2 { font-size:17px; margin:0; line-height:1.4; }
    .section-head small { color:var(--muted); font-size:11px; }
    .diagnosis-list { display:grid; grid-template-columns:63px 1fr;
      gap:14px 1px; font-size:14px; line-height:1.7; }
    .diagnosis-list .name { color:var(--muted); }
    .diagnosis-list p { margin:0; }
    .warranty-list { display:grid; grid-template-columns:1fr auto;
      gap:13px; font-size:14px; }
    .warranty-list .name { color:var(--muted); }
    .service-group { border:1px solid #dedfe3; border-radius:9px;
      overflow:hidden; }
    .service-group .group-title { display:flex; justify-content:space-between;
      background:#f5f5f7; padding:11px; font-weight:600; color:#666;
      font-size:15px; }
    .service-item { background:white; padding:13px 11px;
      display:flex; align-items:center; justify-content:space-between;
      gap:7px; color:#656565; font-size:13px; line-height:1.6; }
    .service-item span:first-child { max-width:70%; }
    .money { font-variant-numeric:tabular-nums; white-space:nowrap; }
    .discount-row { display:flex; justify-content:space-between; gap:8px;
      padding:14px 1px 0; align-items:center; }
    .discount-row .discount-name { display:flex; align-items:center; gap:5px; }
    .discount-row .money { color:var(--red); font-weight:600; }
    .service-total { margin-top:12px; padding-top:16px;
      border-top:1px solid var(--line); text-align:right;
      color:#1f2123; font-size:14px; font-weight:400; line-height:20px; }
    .service-total .repair-amount { font-weight:700; }
    .service-total .amount-symbol { font-size:10px; }
    .service-total .amount-integer { font-size:18px; }
    .service-total .amount-decimal { font-size:12px; }
    .member-charge { margin-top:15px; padding-top:14px;
      border-top:1px dashed #e4e5e9; }
    .member-bill { padding:12px; border:1px solid #f0dfbd;
      border-radius:8px; background:#fffbf5; display:flex;
      align-items:stretch; gap:9px; }
    .member-bill .member-items { flex:1; min-width:0; display:flex;
      flex-direction:column; gap:11px; }
    .member-main { display:flex; align-items:center; gap:9px; }
    .member-main b { font-size:13px; }
    .member-main small { display:block; font-size:10px; color:#999;
      padding-top:3px; }
    .diamond { width:25px; height:25px; flex-shrink:0; }
    .member-bill .member-price { border-left:1px solid #e8d7ba;
      display:grid; place-items:center; padding-left:10px; font-size:15px;
      font-weight:600; }
    .selected-gift { padding-top:8px; border-top:1px dashed #e8dcc7;
      display:flex; align-items:center; gap:8px; font-size:12px; }
    .selected-gift img { width:25px; height:30px; object-fit:contain;
      border-radius:4px; background:white; }
    .selected-gift small { margin-left:auto; color:#999; }
    .cost-summary { display:flex; flex-direction:column; gap:10px;
      padding-top:14px; }
    .cost-summary .summary-line { display:flex; justify-content:space-between;
      align-items:center; color:#777; font-size:12px; }
    .cost-summary .grand-total { color:#242424; font-size:14px;
      padding-top:11px; border-top:1px solid var(--line); }
    .grand-total b { font-size:22px; color:var(--red); }
    .gift-section { padding:15px 12px 11px; }
    .gift-heading { display:flex; align-items:center; justify-content:space-between;
      gap:3px; padding-bottom:11px; }
    .gift-heading h2 { font-size:14px; }
    .gift-heading small { font-size:11px; color:#999; }
    .gift-heading .chosen-count { color:var(--blue); }
    .gift-track { display:flex; gap:7px; overflow-x:auto;
      padding:1px 0 3px; scrollbar-width:none; }
    .gift-track::-webkit-scrollbar { display:none; }
    .gift-card { flex:0 0 calc((100% - 24px)/3.5); min-width:76px;
      background:var(--gift-bg); border:1px solid transparent;
      border-radius:8px; padding:10px 4px 8px; position:relative;
      display:flex; flex-direction:column; align-items:center; gap:7px; }
    .gift-card img { width:49px; height:56px; object-fit:contain;
      background:white; border-radius:5px; }
    .gift-card .gift-name { font-size:11px; white-space:nowrap; }
    .gift-card .gift-value { font-size:10px; color:#777; white-space:nowrap; }
    .gift-card .gift-value em { font-style:normal; color:#ee4b40; }
    .radio { position:absolute; right:5px; top:5px; width:13px; height:13px;
      background:white; border:1px solid #c6cbd5; border-radius:50%; }
    .gift-card[aria-checked='true'] { border-color:#488bff; background:#edf3ff; }
    .gift-card[aria-checked='true'] .radio { border:4px solid #488bff; }
    .gift-card.stockout { opacity:.48; }
    .stock-badge { position:absolute; top:0; right:0; background:#999;
      color:white; font-size:9px; padding:2px 4px; border-radius:0 7px 0 4px; }
    .gift-card.stockout .radio { display:none; }
    .stock-hint { color:#999; font-size:11px; padding-bottom:9px; }
    .address-row { display:flex; align-items:flex-start; gap:8px;
      border-top:1px solid var(--line); padding-top:10px; margin-top:9px; }
    .address-row .address-label { font-weight:600; font-size:11px;
      white-space:nowrap; padding-top:1px; }
    .address-copy { font-size:10px; flex:1; line-height:1.7; min-width:0; }
    .address-copy .address-text { font-size:11px; color:#333; }
    .address-copy .address-region { color:#92959d; }
    .address-copy .recipient { color:#92959d; }
    .address-edit { color:var(--blue); font-size:11px;
      padding:0 0 10px 5px; min-height:30px; }
    .guarantee { background:linear-gradient(110deg,#d9f9ef,#f7fefa);
      color:#50716a; font-size:12px; line-height:1.8; }
    .guarantee .section-head { padding-bottom:7px; }
    .guarantee h2 { color:#3bc5a6; font-size:17px; }
    .guarantee .section-head small { color:#5cbda6; font-size:12px; }
    .guarantee p,.reminder p { margin:0; }
    .reminder { font-size:12px; line-height:1.8; }
    .reminder h2 { padding-bottom:6px; font-size:15px; }
    .bottom { flex-shrink:0; background:white; border-top:1px solid #f1f2f4;
      padding:7px 12px 12px; display:flex; flex-direction:column; gap:7px; }
    .member-protocol { font-size:9px; color:#9a9a9a; text-align:right;
      line-height:1.5; }
    .member-protocol span { color:#6c8ac3; }
    .member-toggle { display:flex; align-items:center; gap:8px;
      background:linear-gradient(105deg,#f6ebd9,#f0ddbf);
      padding:10px 10px; width:100%; text-align:left; border-radius:7px;
      color:#503b20; }
    .member-toggle .member-toggle-copy { flex:1; }
    .member-toggle b { font-size:12px; display:block; }
    .member-toggle small { display:block; padding-top:3px;
      font-size:10px; color:#8e704d; }
    .member-toggle .toggle-check { width:18px; height:18px;
      border:1px solid #d9cdb8; background:white; border-radius:50%;
      color:white; font-size:12px; display:grid; place-items:center; }
    .member-toggle[aria-checked='true'] .toggle-check {
      background:#f54b44; border-color:#f54b44; }
    .member-toggle[aria-disabled='true'] { background:#eee; color:#aaa; }
    .member-toggle[aria-disabled='true'] small { color:#aaa; }
    .bottom-summary { display:flex; justify-content:space-between;
      align-items:center; gap:6px; font-size:11px; padding:2px 1px; }
    .bottom-summary b { font-size:17px; color:var(--red); }
    .primary-btn,.outline-btn { width:100%; height:39px;
      border-radius:5px; font-size:15px; font-weight:500; }
    .primary-btn { background:var(--blue); color:white; }
    .outline-btn { border:1px solid var(--blue); color:var(--blue); }
    .outline-btn.compact { height:33px; font-size:13px; }
    .primary-btn:hover { background:#0065e5; }
    .bottom .confirmed { display:flex; justify-content:center;
      align-items:center; gap:6px; color:#20a77b; font-size:13px; padding:9px; }
    .toast { position:absolute; left:50%; top:49%; transform:translate(-50%,-50%);
      max-width:88%; width:max-content; padding:11px 14px;
      background:#242424e8; color:white; font-size:12px; line-height:1.6;
      border-radius:6px; z-index:80; text-align:center; pointer-events:none; }
    .overlay { position:absolute; inset:0 0 34px; background:#0009; z-index:40;
      display:flex; align-items:flex-end; }
    .sheet { background:#f6f6f8; border-radius:15px 15px 0 0;
      width:100%; max-height:89%; display:flex; flex-direction:column;
      overflow:hidden; }
    .sheet-header { background:white; padding:16px 15px;
      display:flex; justify-content:space-between; align-items:center;
      flex-shrink:0; gap:8px; }
    .sheet-header h2 { font-size:17px; text-align:center; flex:1; }
    .close-sheet { width:28px; height:28px; font-size:28px; line-height:1; }
    .sheet-header .spacer { width:28px; }
    .sheet-body { padding:12px; overflow-y:auto; flex:1; min-height:0;
      overscroll-behavior:contain; }
    .sheet-body .section { padding:15px 12px; }
    .sheet-body .diagnosis-list { font-size:13px; gap:12px 1px; }
    .sheet-bottom { background:white; flex-shrink:0; padding:14px 12px 19px;
      border-radius:13px 13px 0 0; box-shadow:0 -4px 14px #00000004; }
    .question { font-weight:600; font-size:14px; line-height:1.7; margin:0; }
    .question strong { color:var(--red); }
    .question-detail { font-size:11px; color:#777; padding-top:6px; line-height:1.7; }
    .confirm-tip { background:#fff7e6; color:#9d8047;
      font-size:11px; padding:10px; border-radius:7px; margin-top:10px; }
    .confirm-actions { display:flex; gap:10px; padding-top:12px; }
    .confirm-actions button { border:1px solid #d9d9dd;
      background:white; height:44px; border-radius:7px; flex:1; font-size:15px; }
    .confirm-actions .accept { border-color:#9bc4ff; background:#f4f8ff;
      color:var(--blue); }
    .sheet-tabs { display:flex; background:white; flex-shrink:0;
      padding:0 13px; gap:28px; }
    .sheet-tab { padding:0 0 12px; color:#777; font-size:14px;
      position:relative; }
    .sheet-tab.active { font-weight:600; color:#222; }
    .sheet-tab.active:after { content:''; position:absolute; bottom:0;
      left:0; right:0; height:3px; background:var(--blue); border-radius:3px; }
    .address-page { position:absolute; inset:44px 0 34px; z-index:50; background:#f6f6f8;
      display:flex; flex-direction:column; }
    .address-head { height:44px; flex:0 0 44px; background:#f4f4f4; color:#242424; display:flex;
      align-items:center; justify-content:space-between; padding:0 13px;
      border-bottom:1px solid #e8e8e8; }
    .address-head button { font-size:28px; width:25px; }
    .address-head b { font-size:16px; }
    .address-head .spacer { width:25px; }
    .address-list { flex:1; padding:12px; overflow:auto; }
    .address-card { background:white; padding:16px 13px; border-radius:8px;
      margin-bottom:11px; display:flex; flex-direction:column;
      gap:9px; width:100%; text-align:left; border:1px solid transparent; }
    .address-card.active { border-color:#78adff; }
    .address-card b { font-size:13px; font-weight:500; line-height:1.7; }
    .address-card small { color:#92959d; font-size:11px; }
    .address-footer { padding:12px; background:white; }
    .address-form { padding:15px; display:flex; flex-direction:column;
      gap:18px; background:white; border-radius:9px; }
    .address-form label { font-size:12px; display:flex; flex-direction:column; gap:9px; }
    .address-form input,.address-form textarea { padding:11px; border:1px solid #dfe2e8;
      border-radius:5px; width:100%; resize:vertical; color:#333; background:white; }
    .form-error { font-size:11px; color:#e33c31; line-height:1.6; }
    .success-view { background:white; border-radius:9px; padding:27px 14px;
      text-align:center; }
    .success-view .success-check { color:#26ae86; font-size:34px; }
    .success-view h2 { margin:9px 0 6px; font-size:19px; }
    .success-view p { font-size:12px; color:#888; line-height:1.8; }
    .success-summary { text-align:left; padding:12px 0 0; }
    .success-summary .summary-line { padding:7px 0; display:flex;
      justify-content:space-between; font-size:13px; }
    .success-summary .grand-total { border-top:1px solid var(--line);
      padding-top:12px; margin-top:5px; }
    @media(max-width:1270px) and (min-width:821px) {
      .prototype-tools { padding-left:14px; padding-right:14px; }
    }
    @media(max-width:820px) {
      body { background:white; }
      .prototype-tools { padding:8px; gap:5px; height:49px; }
      .mobile-state { display:block; }
      .prototype-tools select { margin-left:0; padding:6px; }
      .prototype-tools .stock-control { margin-left:auto; max-width:100px; }
      .reset { padding:6px 8px; }
      .board { display:block; padding:0; margin:0; max-width:none; }
      .frame { display:none; width:calc(375px * var(--device-scale,1)); margin:auto; }
      .frame.mobile-active { display:block; }
      .frame-label { display:none; }
      .phone { zoom:var(--device-scale,1); }
      .supervision { font-size:11px; }
      .report-scroll { padding-top:12px; }
      .bottom { padding-bottom:12px; }
      .gift-card { min-width:0; }
      .sheet { max-height:92%; }
    }
    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto !important; }
    }
  </style>

      emptyStock = false;
      document.querySelector('.stock-control').value = 'normal';

        closeOverlay(frame, false); closeAddress(frame);
        frame.state = initialState(index);
        renderFrame(frame); frame.root.querySelector('.report-scroll').scrollTop = 0;
      });

        frame.classList.toggle('mobile-active', index === mobileIndex));
    });
    document.querySelector('.stock-control').addEventListener('change', (event) => {
      emptyStock = event.target.value === 'empty';
      frames.forEach((frame) => {
        closeOverlay(frame, false);
        if (emptyStock) {
          frame.state.member = false; frame.state.gift = null;
        }
        frame.state.confirmed = false;
        renderFrame(frame);
      });
    });
    document.addEventListener('keydown', (event) => {
      const frame = frames.find((item) => item.root.contains(document.activeElement));
      if (!frame) return;
      if (event.key === 'Escape') {
        if (frame.root.querySelector('.address-page')) closeAddress(frame);
        else closeOverlay(frame);
      }
      const dialog = frame.root.querySelector('.address-page,.overlay');
      if (event.key === 'Tab' && dialog) {
        const controls = [...dialog.querySelectorAll('button,input,textarea,select,a[href]')]
          .filter((element) => !element.disabled && element.getClientRects().length);
        const first = controls[0]; const last = controls.at(-1);
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault(); last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault(); first.focus();
        }
      }
    });
